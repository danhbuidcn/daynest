<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daynest — Mockup Sprint 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Be+Vietnam+Pro:wght@600;700;800&family=Quicksand:wght@600;700&family=Itim&family=Baloo+2:wght@600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  /* Token — đồng bộ với docs/specs/design-system.md */
  :root {
    --primary: #5BBE98; --primary-dark: #3E9E7A; --primary-soft: #E3F5EC;
    --bg: #FAF8F5; --surface: #FFFFFF; --border: #EFEAE3;
    --text: #2F2D33; --muted: #8C8794;
    --error: #E9787B; --error-soft: #FCE8E8; --warning: #F2B45C; --warning-soft: #FDF1DE;
    --mint: #7FD1B0; --sky: #8CC8EE; --lavender: #B9A6EC;
    --pink: #F4A6C0; --peach: #F7BE8A; --lemon: #F2D67A;
    --shadow: 0 4px 12px rgba(47,45,51,.06);
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Nunito, system-ui, sans-serif; font-weight: 600; color: var(--text); background: #ECE8E2; padding: 32px 16px 64px; }
  header.page { max-width: 1200px; margin: 0 auto 12px; }
  header.page h1 { font-size: 26px; font-weight: 800; }
  header.page p { color: var(--muted); margin-top: 6px; }
  h2.group { max-width: 1600px; margin: 36px auto 16px; font-size: 22px; font-weight: 800; padding-left: 8px; }
  .grid { display: flex; flex-wrap: wrap; gap: 36px 28px; justify-content: center; max-width: 1600px; margin: 0 auto; align-items: flex-start; }
  figure { display: flex; flex-direction: column; gap: 10px; }
  figcaption { font-weight: 800; font-size: 15px; max-width: 360px; }
  figcaption span { color: var(--muted); font-weight: 600; font-size: 13px; margin-left: 6px; }

  /* Khung điện thoại 360×780 */
  .phone { width: 360px; height: 780px; background: var(--bg); border-radius: 36px; border: 8px solid #2F2D33; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,.12); }
  .phone.tall { height: 1180px; }
  .status { height: 28px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 12px; font-weight: 700; }
  .content { flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .screen-title { font-size: 22px; line-height: 28px; font-weight: 800; text-align: center; padding: 14px 16px 12px; }
  .muted { color: var(--muted); }
  .cap { font-size: 12px; line-height: 16px; }
  .b { font-weight: 800; }

  /* Thanh tab (S1) */
  .tabbar { flex: none; height: 64px; background: var(--surface); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; box-shadow: 0 -4px 12px rgba(47,45,51,.05); position: relative; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
  .tab.on { color: var(--primary); font-weight: 800; }
  .tab svg { width: 24px; height: 24px; }
  .fab { justify-self: center; width: 56px; height: 56px; border-radius: 50%; background: var(--primary); display: grid; place-items: center; margin-top: -30px; box-shadow: 0 6px 14px rgba(91,190,152,.45); border: 4px solid var(--bg); }
  .fab svg { width: 28px; height: 28px; }

  /* Thành phần S1 */
  .btn { height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; width: 100%; border: 0; font-family: inherit; color: var(--text); }
    .btn svg { width: 20px; height: 20px; flex: none; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: var(--surface); border: 1.5px solid var(--border); }
  .btn-danger { background: var(--error-soft); color: var(--error); }
  .btn-danger-solid { background: var(--error); color: #fff; }
  .card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); }
  .toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 80px; background: var(--text); color: #fff; font-size: 15px; padding: 10px 18px; border-radius: 999px; white-space: nowrap; display: flex; align-items: center; gap: 12px; z-index: 6; }
  .toast .act { color: var(--mint); font-weight: 800; }
  .topbar { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; padding: 8px 12px; flex: none; }
  .topbar .back, .topbar .act { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--text); }
  .topbar svg { width: 24px; height: 24px; }
  .topbar .screen-title { padding: 6px 0; }
  .group-label { font-size: 12px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .6px; margin: 0 4px -8px; }
  .row { min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 15px; }
  .row + .row { border-top: 1px solid var(--border); }
  .row .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--primary-soft); color: var(--primary-dark); }
  .row.danger { color: var(--error); }
  .row.danger .ico { background: var(--error-soft); color: var(--error); }
  .row .ico svg { width: 20px; height: 20px; }
  .row .label { flex: 1; }
  .row .val { color: var(--muted); font-size: 15px; }
  .row.sub { font-size: 12px; line-height: 16px; min-height: 0; padding: 0 16px 12px 62px; border-top: 0 !important; margin-top: -8px; }
  .scrim { position: absolute; inset: 0; background: rgba(47,45,51,.4); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 5; }
  .dialog { background: var(--surface); border-radius: 24px; padding: 24px 20px 20px; width: 100%; text-align: center; }
  .dialog .dicon { width: 56px; height: 56px; border-radius: 20px; background: var(--primary-soft); color: var(--primary-dark); display: grid; place-items: center; margin: 0 auto 14px; }
  .dialog .dicon.err { background: var(--error-soft); color: var(--error); }
  .dialog .dicon.warn { background: var(--warning-soft); color: var(--warning); }
  .dialog .dicon svg { width: 28px; height: 28px; }
  .dialog h3 { font-size: 17px; font-weight: 700; }
  .dialog p { color: var(--muted); font-size: 15px; line-height: 22px; margin: 6px 0 20px; }
  .dialog .actions { display: flex; gap: 10px; }
  .dialog .stack { display: flex; flex-direction: column; gap: 10px; }
  .under { position: absolute; inset: 28px 0 0; display: flex; flex-direction: column; }
  .opt { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 16px; font-size: 15px; text-align: left; }
  .opt .label { flex: 1; }
  .opt.on { background: var(--primary-soft); font-weight: 800; }
  .input { height: 48px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 15px; }
  .input.focus { border-color: var(--primary); }
  .field label { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin: 0 4px 6px; text-align: left; }
  .form-footer { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 16px 16px; background: var(--bg); }

  /* S2 — Lịch */
  .cal-head { display: grid; grid-template-columns: 32px 1fr 32px auto; align-items: center; gap: 4px; padding: 10px 12px 6px 8px; flex: none; }
  .cal-head .nav { width: 32px; height: 32px; display: grid; place-items: center; color: var(--text); }
  .cal-head .nav svg { width: 22px; height: 22px; }
  .cal-head .t { font-size: 22px; line-height: 28px; font-weight: 800; text-align: center; }
  .chip-today { height: 32px; padding: 0 12px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-dark); font-size: 12px; font-weight: 800; display: flex; align-items: center; }
  .seg { margin: 4px 16px 8px; height: 40px; border-radius: 16px; background: var(--border); display: grid; grid-template-columns: repeat(4, 1fr); padding: 3px; flex: none; }
  .seg span { display: grid; place-items: center; font-size: 15px; border-radius: 13px; }
  .seg span.on { background: var(--primary); color: #fff; font-weight: 700; }
  .wk { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 8px; flex: none; }
  .wk span { text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); padding: 4px 0; }
  .wk span.sun { color: var(--error); }
  .month { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr); padding: 0 8px 4px; }
  .cell { position: relative; border-top: 1px solid var(--border); padding: 3px 2px 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
  .cell:nth-child(7n+1) { border-left: 0; }
  .cell .top { display: flex; flex-direction: column-reverse; padding: 0 1px; }
  .cell .d { align-self: flex-start; font-size: 15px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
  .cell .l { align-self: flex-end; height: 12px; font-size: 10px; line-height: 12px; color: var(--muted); }
  .cell .l.key { color: var(--primary-dark); font-weight: 800; }
  .cell.sun .d, .cell.hol .d { color: var(--error); }
  .cell.today .d { background: var(--primary); color: #fff; font-weight: 800; }
  .cell.sel { background: var(--primary-soft); border-radius: 10px; }
  .cell .addb { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 16px; line-height: 1; }
  .scrim.big { padding: 12px; }
  .dialog.big { max-height: 85%; }
  .cell.out { opacity: .4; }
  .bar { height: 16px; border-radius: 6px; font-size: 12px; line-height: 16px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .more { font-size: 12px; line-height: 14px; color: var(--muted); padding-left: 2px; }
  .ev-mint { background: var(--mint); } .ev-sky { background: var(--sky); } .ev-lavender { background: var(--lavender); }
  .ev-pink { background: var(--pink); } .ev-peach { background: var(--peach); } .ev-lemon { background: var(--lemon); }
  .ev-hol { background: var(--error); color: #fff; }

  .ecard { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); display: flex; align-items: stretch; overflow: hidden; }
  .ecard .stripe { width: 4px; flex: none; }
  .ecard .body { flex: 1; padding: 8px 10px; min-width: 0; }
  .ecard .ttl { font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .ecard .tm { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .ecard .st { display: flex; gap: 4px; align-items: center; padding-right: 10px; color: var(--muted); }
  .st svg { width: 14px; height: 14px; }

  .weekbar { display: flex; gap: 8px; padding: 0 16px 8px; overflow: hidden; flex: none; }
  .wchip { flex: none; width: 76px; height: 52px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .wchip b { font-size: 15px; font-weight: 800; } .wchip i { font-style: normal; font-size: 12px; color: var(--muted); }
  .wchip.on { background: var(--primary); color: #fff; } .wchip.on i { color: #fff; }
  .wrows { flex: 1; overflow: hidden; padding: 0 16px; }
  .wrow { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); min-height: 66px; }
  .wrow .dd { display: flex; flex-direction: column; justify-content: center; }
  .wrow .dd b { font-size: 17px; font-weight: 800; } .wrow .dd span { font-size: 12px; color: var(--muted); }
  .wrow.today .dd { color: var(--primary-dark); }
  .wrow .evs { display: flex; gap: 6px; align-items: center; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .wrow .evs::-webkit-scrollbar { display: none; }
  .wrow .evs .ecard { flex: none; }
  .wrow .none { font-size: 12px; color: var(--muted); align-self: center; }

  .dayhead { padding: 0 16px 6px; display: flex; justify-content: space-between; align-items: baseline; flex: none; }
  .allday { margin: 0 16px; display: grid; grid-template-columns: 44px 1fr; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); flex: none; }
  .hours { flex: 1; position: relative; margin: 0 16px; overflow: hidden; padding-top: 8px; }
  .hr { height: 56px; display: grid; grid-template-columns: 44px 1fr; border-top: 1px solid var(--border); }
  .hr span { font-size: 12px; color: var(--muted); margin-top: -8px; background: var(--bg); width: 36px; }
  .block { position: absolute; left: 50px; border-radius: 12px; padding: 6px 8px; overflow: hidden; border-left: 4px solid; }
  .block .ttl { font-size: 15px; line-height: 18px; } .block .tm { font-size: 12px; color: var(--muted); }
  .nowline { position: absolute; left: 44px; right: 0; height: 2px; background: var(--error); }
  .nowline::before { content: ''; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--error); }

  .daystrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 12px 10px; flex: none; }
  .ds { position: relative; height: 60px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .ds i { font-style: normal; font-size: 12px; color: var(--muted); } .ds b { font-size: 17px; font-weight: 800; } .ds em { font-style: normal; font-size: 12px; color: var(--muted); }
  .ds.on { background: var(--primary); color: #fff; } .ds.on i, .ds.on em { color: #fff; }
  .agenda { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: hidden; }
  .ag { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: stretch; }
  .ag .times { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; justify-content: center; text-align: right; }
  .ag .times b { color: var(--text); font-size: 15px; font-weight: 700; }

  /* Sheet từ đáy */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 24px 24px 0 0; z-index: 6; padding-bottom: 16px; }
  .sheet .grab { width: 36px; height: 4px; border-radius: 4px; background: var(--border); margin: 8px auto 4px; }
  .sheet .shead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 16px 12px; }
  .sheet .shead .h { font-size: 17px; font-weight: 700; text-align: center; }
  .sheet .shead .l { color: var(--muted); font-size: 15px; } .sheet .shead .r { color: var(--primary-dark); font-weight: 800; text-align: right; font-size: 15px; }
  .round-plus { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: grid; place-items: center; justify-self: end; }
  .round-plus svg { width: 22px; height: 22px; }
  .x { width: 40px; height: 40px; display: grid; place-items: center; color: var(--text); }
  .x svg { width: 24px; height: 24px; }
  .sheet .list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .pick { height: 52px; display: flex; align-items: center; justify-content: center; position: relative; font-size: 15px; }
  .pick .ck { position: absolute; right: 20px; top: 14px; }
  .pick + .pick { border-top: 1px solid var(--border); }

  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 8px; }
  .qbtn { height: 112px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; }
  .qbtn .qi { width: 52px; height: 52px; border-radius: 18px; display: grid; place-items: center; background: var(--surface); }
  .qbtn .qi svg { width: 28px; height: 28px; }

  /* Form */
  .form { padding: 0 16px 90px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .fcard { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 4px 16px; }
  .frow { min-height: 52px; display: flex; align-items: center; gap: 12px; font-size: 15px; }
  .frow + .frow { border-top: 1px solid var(--border); }
  .frow .fi { color: var(--primary-dark); display: grid; place-items: center; width: 24px; }
  .frow .fi svg { width: 22px; height: 22px; }
  .frow .grow { flex: 1; }
  .frow.indent { padding-left: 36px; min-height: 44px; border-top: 0 !important; }
  .frow.indent .fi { color: var(--primary); }
  .frow .hint { color: var(--muted); font-size: 12px; }
  .title-in { font-size: 17px; font-weight: 700; padding: 12px 0 4px; }
  .detail-in { font-size: 15px; color: var(--muted); padding: 4px 0 12px; }
  .sw { width: 44px; height: 26px; border-radius: 999px; background: var(--border); position: relative; flex: none; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(47,45,51,.25); }
  .sw.on { background: var(--primary); } .sw.on::after { left: 20px; }
  .info { width: 22px; height: 22px; color: var(--muted); }
  .colors { display: flex; gap: 14px; padding: 4px 0 12px 36px; }
  .cdot { width: 28px; height: 28px; border-radius: 50%; }
  .cdot.on { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--text); }

  .numbox { width: 44px; height: 40px; border-radius: 12px; background: var(--primary-soft); color: var(--primary-dark); display: grid; place-items: center; font-weight: 800; font-size: 17px; }
  .checkbox { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--border); flex: none; }
  .note-hint { background: var(--primary-soft); color: var(--primary-dark); border-radius: 16px; padding: 10px 12px; font-size: 15px; text-align: left; display: flex; gap: 8px; align-items: center; }
  .note-hint svg { width: 18px; height: 18px; flex: none; }

  /* Chi tiết */
  .detail { padding: 4px 16px; display: flex; flex-direction: column; gap: 12px; }
  .dtitle { display: flex; gap: 12px; align-items: center; padding: 8px 4px; }
  .dtitle .sq { width: 20px; height: 20px; border-radius: 7px; flex: none; }
  .dtitle h2 { font-size: 22px; line-height: 28px; font-weight: 800; }
  .tag { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--border); color: var(--muted); font-size: 12px; font-weight: 800; }
  .tag svg { width: 12px; height: 12px; }
  .menu { position: absolute; right: 16px; top: 76px; width: 160px; background: var(--surface); border-radius: 16px; box-shadow: 0 8px 24px rgba(47,45,51,.16); padding: 6px; z-index: 6; }
  .menu div { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 12px; font-size: 15px; }
  .menu div svg { width: 20px; height: 20px; }
  .menu .del { color: var(--error); }

  /* Notes */
  .search { margin: 0 16px 10px; height: 44px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--muted); font-size: 15px; flex: none; }
  .search svg { width: 18px; height: 18px; }
  .chips { display: flex; gap: 8px; padding: 0 16px 12px; overflow: hidden; flex: none; }
  .chip { flex: none; height: 32px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 6px; font-size: 15px; }
  .chip .cd { width: 8px; height: 8px; border-radius: 50%; }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .ngrid { padding: 0 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; overflow: hidden; flex: 1; }
  .ncard { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 12px 12px 10px 14px; border-left: 4px solid var(--border); position: relative; display: flex; flex-direction: column; gap: 6px; }
  .ncard h4 { font-size: 17px; line-height: 22px; font-weight: 700; padding-right: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ncard p { font-size: 15px; line-height: 20px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ncard .pin { position: absolute; right: 10px; top: 12px; color: var(--primary-dark); }
  .ncard .pin svg { width: 16px; height: 16px; }
  .ncard .prog { font-size: 12px; color: var(--primary-dark); font-weight: 800; display: flex; align-items: center; gap: 4px; }
  .ncard .prog svg { width: 14px; height: 14px; }
  .ncard .foot { display: flex; align-items: center; justify-content: space-between; }
  .ncard .more { color: var(--muted); }
  .ncard .more svg { width: 18px; height: 18px; }

  .editor { padding: 0 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; overflow: hidden; }
  .editor .et { font-size: 22px; line-height: 28px; font-weight: 800; padding: 6px 0; }
  .editor .eb { font-size: 15px; line-height: 22px; }
  .cl { min-height: 44px; display: flex; align-items: center; gap: 12px; font-size: 15px; }
  .tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--primary); flex: none; display: grid; place-items: center; }
  .tick.on { background: var(--primary); }
  .cl .tick { border-radius: 6px; }
  .tick svg { width: 14px; height: 14px; }
  .cl.done span { text-decoration: line-through; color: var(--muted); }
  .cl .grow { flex: 1; }
  .cl .grip { color: var(--muted); margin-right: -6px; } .cl .grip svg { width: 18px; height: 18px; }

    ${pro ? `<div class="warnrow" style="margin:0"><span>${I.warn}</span><div>Gói Pro vẫn tính phí. Hãy huỷ gói trong Google Play.<a>Mở Google Play</a></div></div>` : ''}
  </div>
  <div class="form-footer"><button class="btn btn-danger-solid">Xoá tài khoản</button></div>
</div>`;
const dlg = (icon, cls, title, text, actions) => `<div class="scrim"><div class="dialog"><div class="dicon ${cls}">${icon}</div><h3>${title}</h3>${text ? `<p>${text}</p>` : '<div style="height:14px"></div>'}${actions}</div></div>`;
const two = (a, b, danger = true) => `<div class="actions"><button class="btn btn-secondary">${a}</button><button class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}">${b}</button></div>`;
const phoneWith = (screen, overlay = '', cls = '') => `<div class="phone ${cls}">${status}<div class="under">${screen}</div>${overlay}</div>`;

// Màn Daynest Pro
const plan = (name, price, per, on, tag = '') => `<div class="plan ${on ? 'on' : ''}">
  <span class="radio">${on ? '<i></i>' : ''}</span><div class="pn"><b>${name}</b>${tag ? `<em>${tag}</em>` : ''}</div><div class="pp"><b>${price}</b><span>${per}</span></div></div>`;
const proScreen = ({ sel = 'y', busy = false, offline = false } = {}) => `<div class="content">${offline ? offBanner : ''}
  <div class="topbar"><span class="back">${I.left}</span><div class="screen-title">Daynest Pro</div><span></span></div>
  <div class="settings" style="gap:14px">
    <div class="card hero"><span class="crown">${I.crown}</span><div style="font-size:17px;font-weight:700">Không quảng cáo</div><div class="muted" style="font-size:15px">Dùng chung trên mọi thiết bị</div></div>
    <div class="plans">${plan('Hằng tháng', '29.000đ', '/ tháng', sel === 'm')}${plan('Hằng năm', '299.000đ', '/ năm', sel === 'y', 'Tiết kiệm 14%')}${plan('Trọn đời', '599.000đ', 'mua một lần', sel === 'l')}</div>
  </div>
  <div class="form-footer" style="display:flex;flex-direction:column;gap:6px">
    <button class="btn btn-primary" ${offline ? 'style="opacity:.45"' : ''}>${busy ? '<span class="spin"></span>Đang xử lý' : 'Tiếp tục'}</button>
    <button class="btn btn-secondary" style="height:44px">${I.play}Xem quảng cáo để tắt 24 giờ</button>
    <button class="btn" style="height:40px;background:none;color:var(--primary-dark);font-weight:800">Khôi phục giao dịch</button>
  </div>
</div>`;
const offBanner = `<div class="offbar">${I.wifiOff}<span>Không có mạng</span></div>`;
const proActive = (kind) => `<div class="content">
  <div class="topbar"><span class="back">${I.left}</span><div class="screen-title">Daynest Pro</div><span></span></div>
  <div class="settings" style="gap:14px">
    <div class="card hero on"><span class="crown">${I.crown}</span><div style="font-size:17px;font-weight:700">Bạn đang dùng Pro</div><div class="muted" style="font-size:15px">${kind === 'l' ? 'Gói trọn đời' : kind === 'y' ? 'Gói năm · gia hạn 15/10/2027' : 'Gói tháng · gia hạn 15/11/2026'}</div></div>
    ${kind === 'l' ? '' : `<div class="card">${sr(I.store, 'Quản lý gói trong Google Play', chev)}</div>`}
    <div class="card">${sr(I.restore, 'Khôi phục giao dịch', chev)}</div>
  </div>
</div>`;

// Banner
const banner = (loading) => `<div class="adbar">${loading ? '' : `<span class="adtag">Quảng cáo</span><div class="adimg"></div><div class="adtxt"><b>Tên quảng cáo mẫu</b><span>Nội dung do AdMob chọn</span></div><span class="adbtn">Mở</span>`}</div>`;
const calScreen = () => calMonth();
const nativeAd = `<div class="card" style="padding:12px 16px;display:flex;gap:12px;align-items:center;position:relative"><span class="adtag" style="border-radius:8px 0 8px 0">Quảng cáo</span><div class="adimg" style="width:44px;height:44px;margin-top:8px"></div><div class="adtxt" style="margin-top:8px"><b style="font-size:15px">Tên quảng cáo mẫu</b><span>Nội dung do AdMob chọn</span></div><span class="adbtn">Mở</span></div>`;
const noteScreen = (ad) => {
  if (!ad) return notesScreen;
  const col = (list) => `<div class="ncols"><div>${list.filter((_, n) => n % 2 === 0).map(ncard).join('')}</div><div>${list.filter((_, n) => n % 2).map(ncard).join('')}</div></div>`;
  return `<div class="content">${notesTop}<div class="nlist">${col(NOTES.slice(0, 4))}<div style="margin:2px 0 10px">${nativeAd}</div>${col(NOTES.slice(4))}</div></div>${tabbar('man')}`;
};
const expScreen = (ad) => { const h = expMonth(7800000); return ad ? h.replace('<div class="card" style="padding-bottom:8px"><div class="sec">Theo nhóm', nativeAd.replace('<div class="card"', '<div class="card" style="margin-bottom:12px;') + '<div class="card" style="padding-bottom:8px"><div class="sec">Theo nhóm') : h; };
const withBanner = (screen, tab, loading) => phone(`<div class="under">${screen}${banner(loading)}</div>`);
const formScreen = () => `<div class="content"><div class="topbar"><span class="back">${I.close}</span><div class="screen-title">Thêm sự kiện</div><span></span></div>
  <div class="form"><div class="fcard"><div class="title-in">Họp nhóm</div><div class="detail-in">Chi tiết</div></div><div class="fcard"><div class="frow"><span class="fi">${I.clock}</span><span class="grow">9:00 – 10:00</span></div><div class="frow"><span class="fi">${I.cal(false)}</span><span class="grow">Thứ Năm, 15/10</span></div></div></div>
  <div class="form-footer"><button class="btn btn-primary">Lưu</button></div></div>`;

// UMP (hộp do Google dựng; vẽ gần đúng để biết vị trí)
const ump = `<div class="scrim"><div class="dialog" style="text-align:left;padding:20px">
  <h3>Quyền riêng tư của bạn</h3>
  <p style="margin-bottom:14px">Daynest và đối tác dùng dữ liệu như mã nhận dạng thiết bị để hiển thị quảng cáo.</p>
  <div class="stack"><button class="btn btn-primary">Đồng ý</button><button class="btn btn-secondary">Quản lý tuỳ chọn</button></div></div></div>`;

const ph = (html, cls = '') => `<div class="phone ${cls}">${status}${html}</div>`;
const groups = [
  ['A. Xoá tài khoản', [
    ['1. Cài đặt', 'nhóm "Tài khoản" mới ở đầu: Daynest Pro · dòng "Chính sách quyền riêng tư" ở nhóm Ứng dụng · Đăng xuất và Xoá tài khoản (chữ đỏ) nằm cuối cùng', ph(settings({ hi: 'del' }), 'tall')],
    ['2. Xoá tài khoản', 'liệt kê dữ liệu bị xoá · nút đỏ cố định ở đáy', ph(delScreen(false))],
    ['2b. Đang có Pro', 'thêm dòng cảnh báo: gói Pro vẫn tính phí → mở Google Play để huỷ', ph(delScreen(true))],
    ['3. Hộp xác nhận', 'bấm nút ở màn 2 · không thể hoàn tác', phoneWith(delScreen(false), dlg(I.userx, 'err', 'Xoá tài khoản?', 'Toàn bộ dữ liệu sẽ bị xoá vĩnh viễn.', two('Huỷ', 'Xoá')))],
    ['3b. Đang xoá', 'khoá mọi nút, không đóng được', phoneWith(delScreen(false), dlg('<span class="spin big"></span>', '', 'Đang xoá tài khoản', '', ''))],
    ['3c. Lỗi', 'mất mạng hoặc máy chủ lỗi · thử lại được, dữ liệu chưa bị xoá', phoneWith(delScreen(false), dlg(I.warn, 'warn', 'Chưa xoá được', 'Vui lòng thử lại sau.', two('Đóng', 'Thử lại', false)))],
  ]],
  ['B. Daynest Pro', [
    ['4. Chọn gói', 'mặc định chọn gói năm · nút "Tiếp tục" mở màn thanh toán của Google Play', ph(proScreen())],
    ['4b. Đang xử lý', 'sau khi chọn gói ở Google Play · khoá nút', ph(proScreen({ busy: true }))],
    ['4c. Mất mạng', 'không mua được · nút mờ', ph(proScreen({ offline: true }))],
    ['5. Đã mua (năm)', 'thay màn chọn gói · mở trang quản lý gói của Google Play', ph(proActive('y'))],
    ['5b. Đã mua (trọn đời)', 'không có dòng quản lý gói', ph(proActive('l'))],
    ['6. Mua xong', 'toast · mọi quảng cáo biến mất ngay', phoneWith(proActive('y'), '<div class="toast">Đã bật Pro</div>')],
    ['7. Khôi phục: không có gói', 'hộp thông báo sau khi bấm "Khôi phục giao dịch"', phoneWith(proScreen(), dlg(I.restore, 'warn', 'Không tìm thấy giao dịch', 'Tài khoản Google Play này chưa mua Pro.', '<button class="btn btn-primary">Đã hiểu</button>'))],
    ['7b. Khôi phục: thành công', '', phoneWith(proScreen(), '<div class="toast" style="bottom:130px">Đã khôi phục Pro</div>')],
  ]],
  ['C. Banner quảng cáo (chưa mua Pro)', [
    ['8. Lịch', 'banner cố định dưới cùng, dưới thanh tab', withBanner(calScreen(), 'cal')],
    ['9. Ghi chú', 'có thẻ quảng cáo gốc (E1)', withBanner(noteScreen(true), 'man')],
    ['10. Chi tiêu', 'có thẻ quảng cáo gốc (E2)', withBanner(expScreen(true), 'exp')],
    ['11. Chưa tải được', 'không chừa chỗ trống · hiện khi tải xong, không báo lỗi', withBanner(calScreen(), 'cal', true)],
    ['12. Màn soạn', 'KHÔNG quảng cáo nào (thêm / sửa event, note, khoản chi, todo)', ph(formScreen())],
    ['13. Cài đặt', 'KHÔNG quảng cáo nào · cả các màn con và màn Pro', ph(settings({ pro: false }), 'tall')],
    ['13b. Cài đặt (đã mua Pro)', 'thẻ tài khoản có huy hiệu Pro cạnh tên + viền quanh avatar · dòng Daynest Pro ghi "Đang dùng · gói năm"', ph(settings({ pro: true, hi: 'pro' }), 'tall')],
    ['14. Đã mua Pro', 'không banner ở mọi tab', ph(`<div class="under">${calScreen()}</div>`)],
  ]],
  ['E. Quảng cáo gốc, xem để tắt', [
    ['17. Quảng cáo gốc', 'thẻ xen sau mục thứ 4 của danh sách Ghi chú (và Chi tiêu, màn 9, 10) · cùng kiểu thẻ của app, có nhãn "Quảng cáo"', withBanner(noteScreen(true), 'man')],
    ['18. Xem để tắt 24 giờ', 'nút ở màn Daynest Pro (màn 4) → xem 1 quảng cáo có thưởng', ph(proScreen())],
    ['18b. Đã tắt 24 giờ', 'toast sau khi xem xong · mọi quảng cáo tắt, hết hạn thì hiện lại', phoneWith(calScreen(), '<div class="toast" style="bottom:90px">Đã tắt quảng cáo 24 giờ</div>')],
    ['18c. Chưa có quảng cáo để xem', 'khi AdMob chưa trả quảng cáo', phoneWith(proScreen(), dlg(I.warn, 'warn', 'Chưa có quảng cáo', 'Vui lòng thử lại sau.', '<button class="btn btn-primary">Đã hiểu</button>'))],
  ]],
  ['D. Đồng ý quảng cáo (EU / UK)', [
    ['15. Lần mở app đầu', 'hộp do Google dựng (UMP) · chỉ hiện ở EU / UK · chưa đồng ý thì chưa hiện banner', phoneWith(calScreen(), ump)],
    ['16. Cài đặt', 'dòng "Tuỳ chọn quảng cáo" chỉ có ở EU / UK · mở lại hộp để đổi lựa chọn', ph(settings({ eu: true, hi: 'ump' }), 'tall')],
  ]],
];
document.getElementById('root').innerHTML = groups.map(([g, list]) => `<h2 class="group">${g}</h2><div class="grid">${list.map(([t, s, html]) => `<figure><figcaption>${t}<span>${s}</span></figcaption>${html}</figure>`).join('')}</div>`).join('');
document.head.insertAdjacentHTML('beforeend', `<style>
  .hl2 { box-shadow: 0 0 0 2px var(--primary); border-radius: 12px; }
  .probadge { display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 8px; margin-left:8px; border-radius:999px; background:var(--primary-soft); color:var(--primary-dark); font-size:12px; font-weight:800; vertical-align:2px; }
  .probadge svg { width:14px; height:14px; }
  .avatar.pro { box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--primary); }
  .plans { display:flex; flex-direction:column; gap:10px; }
  .plan { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:20px; background:var(--surface); box-shadow:var(--shadow); border:2px solid transparent; }
  .plan.on { border-color:var(--primary); background:var(--primary-soft); }
  .plan .radio { width:22px; height:22px; border-radius:50%; border:2px solid var(--border); display:grid; place-items:center; flex:none; }
  .plan.on .radio { border-color:var(--primary); } .plan .radio i { width:12px; height:12px; border-radius:50%; background:var(--primary); }
  .plan .pn { flex:1; display:flex; flex-direction:column; gap:2px; font-size:15px; } .plan .pn em { font-style:normal; font-size:12px; color:var(--primary-dark); font-weight:800; }
  .plan .pp { text-align:right; display:flex; flex-direction:column; } .plan .pp span { font-size:12px; color:var(--muted); }
  .hero { padding:20px 16px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .hero .crown { width:56px; height:56px; border-radius:20px; background:var(--primary-soft); color:var(--primary-dark); display:grid; place-items:center; } .hero .crown svg { width:28px; height:28px; }
  .hero.on { background:var(--primary-soft); }
  .adbar { flex:none; height:50px; background:var(--surface); border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; padding:0 8px; position:relative; }
  .adbar:empty { display:none; }
  .adtag { position:absolute; top:0; left:0; font-size:10px; background:var(--warning-soft); color:var(--text); padding:0 6px; border-radius:0 0 8px 0; line-height:14px; }
  .adimg { width:36px; height:36px; border-radius:8px; background:var(--border); flex:none; margin-top:6px; }
  .adtxt { flex:1; display:flex; flex-direction:column; font-size:12px; margin-top:6px; } .adtxt span { color:var(--muted); }
  .adbtn { height:30px; padding:0 14px; border-radius:8px; background:var(--primary); color:#fff; font-size:12px; font-weight:800; display:grid; place-items:center; margin-top:6px; }
  .offbar { flex:none; height:32px; background:var(--warning-soft); display:flex; align-items:center; justify-content:center; gap:8px; font-size:12px; font-weight:700; }
  .offbar svg { width:16px; height:16px; }
  .spin { width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.5); border-top-color:#fff; display:inline-block; }
  .spin.big { width:28px; height:28px; border-color:var(--primary-soft); border-top-color:var(--primary); }
  .dialog .dicon:has(.spin) { background:none; }
</style>`);

}
</script>
</body>
